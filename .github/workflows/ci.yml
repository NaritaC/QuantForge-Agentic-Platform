name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,ui]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest --cov=quantforge --cov-report=term-missing
      - name: Offline vertical slice
        run: python -m quantforge pipeline --config configs/mvp.yaml
      - name: Offline research loop
        run: python -m quantforge experiment --config configs/research-demo.yaml
