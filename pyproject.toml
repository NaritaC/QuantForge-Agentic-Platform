[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge-agentic-platform"
version = "0.1.0"
description = "Audit-first, agent-assisted quantitative research platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "NaritaC"}]
dependencies = [
  "duckdb>=1.2,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]
baostock = ["baostock>=0.9.3,<1"]
ui = ["streamlit>=1.50,<2"]

[project.scripts]
quantforge = "quantforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
# Streamlit AppTest executes page code outside coverage.py's active tracer.
# The page still has an explicit render smoke test in test_dashboard_data.py.
omit = ["src/quantforge/ui/app.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
